# Agent配置
agent:
  # API provider: "anthropic" or "openai"
  provider: "openai"
  model: "openrouter/free"
  max_tokens: 8000
  temperature: 0.7

# 上下文管理
context:
  window_size: 128000
  strategy: "compact"
  compact_threshold: 0.9

# 记忆配置
memory:
  max_search_results: 5000

# 插件配置
plugins:
  hot_reload: true
  auto_activate: true

# Bash工具开关（关闭后不向模型提供bash工具）
bash:
  enabled: true

# 浏览器配置
# enabled: 关闭后不向模型提供browser工具（Docker镜像默认未安装浏览器时保持关闭）
browser:
  enabled: true
  headless: true

# 定时任务
# schedules:
#   - description: "浏览 Hacker News 了解技术动态"
#     cron: "0 9 * * *"
#   - description: "检查 GitHub 通知"
#     cron: "0 * * * *"

# 日志
logging:
  level: "INFO"

